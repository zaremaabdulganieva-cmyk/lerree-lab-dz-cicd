# Раз в неделю Dependabot проверяет зависимости и сам открывает pull
# request с обновлением. PR проходит тот же CI, что и обычный код, —
# сломанное обновление не попадёт на боевой адрес.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Пакеты, которые обязаны обновляться вместе. Найдено на первом же
      # прогоне: react без react-dom и vitest без своего модуля покрытия
      # по отдельности ломают сборку — CI такие PR не пропустил.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      vitest:
        patterns: ['vitest', '@vitest/*']
      # Мелкие обновления инструментов — одним PR, чтобы не заваливать.
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
