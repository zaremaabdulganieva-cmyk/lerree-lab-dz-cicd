# nginx для образа кабинета: отдаёт собранный React и повторяет
# правила Vercel (vercel.json) — адреса разделов и заголовки безопасности.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Не сообщаем версию сервера.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Заголовки безопасности — те же, что на Vercel.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://mc.yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://mc.yandex.ru https://mc.yandex.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://mc.yandex.ru https://mc.yandex.com wss://mc.yandex.ru https://mc.webvisor.com https://mc.webvisor.org; frame-src blob: https://mc.yandex.ru https://mc.yandex.com; child-src blob: https://mc.yandex.ru; frame-ancestors https://metrika.yandex.ru https://metrika.yandex.com https://webvisor.com https://*.webvisor.com; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Проверка, что контейнер жив (для HEALTHCHECK и оркестраторов).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Файлы сборки с хешем в имени не меняются — кешируем надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Любой адрес раздела (/programs, /measurements…) отдаёт приложение,
    # дальше маршрут разбирает React Router.
    location / {
        try_files $uri /index.html;
    }
}
