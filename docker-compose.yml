# =====================================================================
# Локальная песочница базы данных.
#
# Зачем: прогнать миграции и политики доступа у себя на компьютере
# прежде, чем выполнять их в облаке Supabase. Поднимается одной командой:
#
#   cp .env.example .env
#   docker compose up -d
#   docker compose exec db psql -U postgres -d lerree_demo -c '\dt'
#
# Боевой backend демо-кабинета — облачный Supabase (см. backend_documentation.md).
# =====================================================================

services:
  db:
    image: postgres:17-alpine
    container_name: lerree-demo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-lerree_demo}
    ports:
      # Наружу порт не открываем: только на этот компьютер.
      - '127.0.0.1:${POSTGRES_PORT:-54329}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      # Файлы выполняются по порядку имён при первом запуске.
      - ./docker/00_auth_stub.sql:/docker-entrypoint-initdb.d/00_auth_stub.sql:ro
      - ./supabase/migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
      - ./supabase/migrations/002_rls_policies.sql:/docker-entrypoint-initdb.d/02_rls_policies.sql:ro
      - ./supabase/migrations/003_seed_content.sql:/docker-entrypoint-initdb.d/03_seed_content.sql:ro
      - ./docker/04_local_demo_users.sql:/docker-entrypoint-initdb.d/04_local_demo_users.sql:ro
      - ./supabase/migrations/004_demo_users.sql:/docker-entrypoint-initdb.d/05_demo_users.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lerree_demo}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Само приложение в контейнере (nginx + собранный React).
  # Запускается отдельно, чтобы обычный `docker compose up` по-прежнему
  # поднимал только базу:  docker compose --profile app up --build
  # Ходит в облачный Supabase из .env — локальная песочница выше нужна
  # только для проверки миграций.
  app:
    profiles: [app]
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?задайте VITE_SUPABASE_URL в .env}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?задайте VITE_SUPABASE_ANON_KEY в .env}
    container_name: lerree-cabinet
    restart: unless-stopped
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'

volumes:
  db-data:
